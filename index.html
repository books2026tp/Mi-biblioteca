<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Biblioteca 📚</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f3f9;
    color:#302936;
}

header{
    background:linear-gradient(135deg,#eadcf0,#f8eaf2);
    padding:40px 20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:34px;
}

header p{
    margin:8px 0 0;
    color:#766d79;
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px 18px;
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

input,
select{
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #e3d9e6;
    font-size:15px;
}

#search{
    flex:1;
    min-width:220px;
}

.library{
    display:grid;
    grid-template-columns:repeat(
        auto-fill,
        minmax(240px,1fr)
    );
    gap:18px;
}

.card{
    background:white;
    border:1px solid #e7dfe9;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 18px rgba(80,50,80,.08);
}

.book-icon{
    font-size:42px;
}

.card h2{
    font-size:19px;
    margin:10px 0 5px;
}

.card p{
    color:#766d79;
    font-size:14px;
}

.read{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#9b6fae;
    color:white;
    padding:11px;
    border-radius:11px;
    font-weight:bold;
    margin-top:15px;
}

.empty{
    text-align:center;
    color:#766d79;
    padding:50px 10px;
}

</style>
</head>

<body>

<header>

<h1>📚 Mi Biblioteca</h1>

<p>
Mis novelas, lecturas y trabajos de la universidad
</p>

</header>

<main>

<div class="toolbar">

<input
id="search"
type="search"
placeholder="🔎 Buscar libro o autor..."
oninput="buscar()"
>

<select
id="categoria"
onchange="buscar()"
>

<option value="">
Todos los géneros
</option>

<option value="Romance">
💕 Romance
</option>

<option value="Fantasia">
🧚 Fantasía
</option>

<option value="Suspenso">
🔎 Suspenso
</option>

<option value="Clasicos">
📚 Clásicos
</option>

<option value="Universidad">
🎓 Universidad
</option>

</select>

</div>


<div
id="biblioteca"
class="library"
></div>

</main>


<script>

/* ==================================================
LIBROS
================================================== */

const libros = [

/* HARRY POTTER */

{
titulo:"Harry Potter y la piedra filosofal",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterLaPiedraFilosofal.pdf"
},

{
titulo:"Harry Potter y la cámara secreta",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterLaCamaraDeLosSecretos.pdf"
},

{
titulo:"Harry Potter y el prisionero de Azkaban",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterElPrisioneroDeAzkaban.pdf"
},

{
titulo:"Harry Potter y el cáliz de fuego",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterElCalizDeFuego.pdf"
},

{
titulo:"Harry Potter y la Orden del Fénix",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterLaOrdenDelFenix.pdf"
},

{
titulo:"Harry Potter y el misterio del príncipe",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterElMisterioDelPrincipe.pdf"
},

{
titulo:"Harry Potter y las reliquias de la muerte",
autor:"J. K. Rowling",
categoria:"Fantasia",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/HarryPotterLasReliquiasDeLaMuerte.pdf"
},


/* NOVELAS */

{
titulo:"La casa de los espíritus",
autor:"Isabel Allende",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/LaCasaDeLosEspiritus.pdf"
},

{
titulo:"El olvido que seremos",
autor:"Héctor Abad Faciolince",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/ElOlvidoQueSeremos.pdf"
},

{
titulo:"Satanás",
autor:"Mario Mendoza",
categoria:"Suspenso",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/Satanas.pdf"
},

{
titulo:"Ensayo sobre la ceguera",
autor:"José Saramago",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/EnsayoSobreLaCeguera.pdf"
},

{
titulo:"Cien años de soledad",
autor:"Gabriel García Márquez",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/CienAnosDeSoledad.pdf"
},

{
titulo:"Boulevard",
autor:"Flor M. Salvador",
categoria:"Romance",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/Boulevard.pdf"
},

{
titulo:"The Little Prince",
autor:"Antoine de Saint-Exupéry",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/TheLittlePrince.pdf"
},

{
titulo:"El Principito",
autor:"Antoine de Saint-Exupéry",
categoria:"Clasicos",
pdf:"https://raw.githubusercontent.com/books2026tp/Mi-biblioteca/main/ElPrincipito.pdf"
}

];


/* ==================================================
GOOGLE VIEWER
================================================== */

function visor(url){

return "https://docs.google.com/viewer?url="
+ encodeURIComponent(url);

}


/* ==================================================
MOSTRAR LIBROS
================================================== */

function mostrar(lista){

const contenedor =
document.getElementById("biblioteca");

if(lista.length === 0){

contenedor.innerHTML = `

<div class="empty">

<div style="font-size:50px">
📚
</div>

<h2>
No encontramos ese libro
</h2>

<p>
Prueba con otro título, autor o género.
</p>

</div>

`;

return;

}


contenedor.innerHTML = lista.map(

libro => `

<article class="card">

<div class="book-icon">
📖
</div>

<h2>
${libro.titulo}
</h2>

<p>

${libro.autor}

<br>

${libro.categoria}

</p>

<a
class="read"
href="${visor(libro.pdf)}"
target="_blank"
>
📖 Leer
</a>

</article>

`

).join("");

}


/* ==================================================
BUSCADOR
================================================== */

function buscar(){

const texto =
document
.getElementById("search")
.value
.toLowerCase();

const categoria =
document
.getElementById("categoria")
.value;


const resultados =
libros.filter(libro => {

const coincideTexto =

libro.titulo
.toLowerCase()
.includes(texto)

||

libro.autor
.toLowerCase()
.includes(texto);


const coincideCategoria =

!categoria

||

libro.categoria === categoria;


return
coincideTexto
&&
coincideCategoria;

});


mostrar(resultados);

}


/* ==================================================
INICIAR
================================================== */

mostrar(libros);

</script>

</body>
</html>
